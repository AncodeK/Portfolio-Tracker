<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
    onSnapshot, query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
  apiKey: "AIzaSyDLh7c5zpbmUJyoNfHLyOWCqFaRY3wAgHU",
  authDomain: "hk-tracker-b2ecb.firebaseapp.com",
  projectId: "hk-tracker-b2ecb",
  storageBucket: "hk-tracker-b2ecb.firebasestorage.app",
  messagingSenderId: "835611981371",
  appId: "1:835611981371:web:ccebf419516cada00fce1e"
};

  let db = null;
  let firebaseReady = false;
  try {
    if (!firebaseConfig.apiKey.startsWith("REPLACE_")) {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      firebaseReady = true;
    }
  } catch (e) {
    console.error("Firebase init failed:", e);
  }

  window.__fb = {
    ready: firebaseReady,
    db,
    collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp,
  };
  window.dispatchEvent(new Event("firebase-ready"));
</script>

<style>
  :root {
    /* Helshoogte blue, from the official logo file (#506c84) */
    --maroon: #506C84;
    --maroon-deep: #2B3E4F;
    --maroon-light: #6C8CA6;
    --brass: #C7A045;
    --brass-light: #EDE0BE;
    --ink: #211D1A;
    --ink-soft: #6B655D;
    --parchment: #F7F4EE;
    --parchment-deep: #EFE9DD;
    --table-grey: #E7E9EB;
    --paper: #FFFFFF;
    --line: #E3DBC9;
    --dusk: #A9C4DE;
    --green: #2E6B3E; --green-bg: #E4EFE3;
    --amber: #A56A0E; --amber-bg: #F6EAD3;
    --red: #A32E22; --red-bg: #F6DEDA;
    --radius: 4px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #fff;
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
  }
  h1, h2, h3, .display, button.cta, .topbar .title, nav button {
    font-family: 'Jost', 'Inter', sans-serif;
    letter-spacing: 0.01em;
  }
  .serif { font-family: 'Source Serif 4', Georgia, serif; }
  a { color: inherit; }

  /* ---- shared app shell (tracker/dashboard/issues) ---- */
  .topbar {
    background: var(--maroon-deep);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 24px;
    border-bottom: 3px solid #111;
    position: sticky; top: 0; z-index: 20;
  }
  .topbar img.crest { height: 34px; width: auto; display: block; }
  .topbar .title { font-weight: 600; font-size: 1.02rem; }
  .topbar .title small { display: block; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 0.66rem; color: #CBB98A; letter-spacing: 0.08em; }
  .topbar nav { margin-left: auto; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .topbar nav button {
    background: transparent; border: 1px solid transparent; color: #E7DFCF;
    padding: 7px 14px; border-radius: 999px; font-size: 0.84rem; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .topbar nav button:hover { background: rgba(255,255,255,0.08); }
  .topbar nav button.active { background: var(--brass); color: var(--maroon-deep); font-weight: 600; }
  .topbar .whoami { font-size: 0.8rem; color: #CBB98A; padding-left: 10px; border-left: 1px solid rgba(255,255,255,0.2); margin-left: 6px; }
  .topbar .whoami b { color: #fff; font-weight: 600; }

  main.app-main { max-width: 1480px; margin: 0 auto; padding: 28px 24px 60px; }

  .home-hero .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(43,62,79,0.62) 0%, rgba(43,62,79,0.40) 22%, rgba(43,62,79,0.58) 45%, rgba(19,28,36,0.94) 88%, #0F1820 100%);
  }
  .home-hero .content {
    position: relative; z-index: 2;
    flex: 1;
    display: flex; flex-direction: column;
    max-width: 1400px; width: 100%; margin: 0 auto;
    padding: 36px 24px 56px;
  }
  .home-hero .brand-row { display: flex; align-items: center; gap: 18px; }
  .home-hero .brand-row img.crest-icon { height: 104px; width: auto; }
  .home-hero .brand-row img.wordmark { height: 120px; width: auto; }
  .home-hero .brand-row .divider { width: 1px; height: 52px; background: rgba(255,255,255,0.25); }
  .home-hero .brand-row span { color: #E7DFCF; font-size: 0.72rem; letter-spacing: 0.12em; font-family: 'Jost', sans-serif; }
  .home-hero .headline-block { margin-top: auto; margin-bottom: 54px; padding-top: 60px; color: #fff; max-width: 720px; }
  .home-hero .eyebrow { color: var(--maroon-light); font-size: 0.82rem; font-family: 'Jost', sans-serif; letter-spacing: 0.05em; margin-bottom: 10px; }
  .home-hero h1 {
    font-size: clamp(2.1rem, 5vw, 3.4rem);
    line-height: 1.08; margin: 0 0 16px; font-weight: 600;
  }
  .home-hero p.lede { font-family: 'Source Serif 4', Georgia, serif; font-size: 1.1rem; line-height: 1.55; color: #E9E2D3; max-width: 560px; margin: 0 0 34px; }

  .path-choice {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.22);
    max-width: 720px;
  }
  .path-choice button {
    background: rgba(43,62,79,0.72);
    border: none; color: #fff; text-align: left; cursor: pointer;
    padding: 26px 26px; font: inherit;
    display: flex; flex-direction: column; gap: 6px;
    transition: background .18s;
  }
  .path-choice button:hover { background: rgba(80,108,132,0.85); }
  .path-choice button .path-label { font-family: 'Jost', sans-serif; font-size: 1.12rem; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 10px; }
  .path-choice button .path-label .mark { color: #fff; font-size: 1.3rem; line-height: 1; }
  .path-choice button .path-desc { font-size: 0.86rem; color: #C9BFAE; line-height: 1.4; }

  .home-hero .foot-strip {
    position: relative; z-index: 2;
    text-align: center; padding: 16px; color: #8A7A65; font-size: 0.7rem; letter-spacing: 0.04em;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  /* ---- FORM PAGES (login / report) ---- */
  .form-shell {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    background: #fff;
    padding: 40px 20px;
  }
  .form-shell .back-link {
    align-self: flex-start; max-width: 460px; width: 100%; margin: 0 auto 28px;
    background: none; border: none; color: var(--maroon); font: inherit; font-size: 0.86rem;
    cursor: pointer; padding: 0; display: flex; align-items: center; gap: 6px;
  }
  .form-card {
    max-width: 460px; width: 100%;
    background: var(--paper); border: 1px solid var(--line);
    padding: 38px 34px;
  }
  .form-card .crest-mark { height: 40px; margin-bottom: 18px; }
  .form-card h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--maroon); }
  .form-card p.intro { color: var(--ink-soft); font-size: 0.9rem; line-height: 1.5; margin: 0 0 26px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--ink); margin-bottom: 6px; letter-spacing: 0.01em; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid var(--line); background: #fff;
    padding: 11px 12px; font: inherit; font-size: 0.94rem; color: var(--ink); border-radius: 2px;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--maroon); background: #fff; }
  .field textarea { resize: vertical; min-height: 90px; }
  .field-hint { font-size: 0.76rem; color: var(--ink-soft); margin-top: 5px; }
  button.cta {
    width: 100%; background: var(--maroon); color: #fff; border: none;
    padding: 13px 20px; font-size: 0.95rem; font-weight: 600; cursor: pointer; letter-spacing: 0.01em;
    transition: background .15s;
  }
  button.cta:hover { background: var(--maroon-light); }
  button.cta.secondary { background: transparent; color: var(--maroon); border: 1px solid var(--maroon); }
  button.cta.secondary:hover { background: var(--brass-light); }
  .form-msg { font-size: 0.85rem; padding: 10px 13px; margin-bottom: 18px; border-radius: 2px; }
  .form-msg.error { background: var(--red-bg); color: var(--red); }
  .form-msg.success { background: var(--green-bg); color: var(--green); }

  /* ---- section headers / panels (tracker, dashboard, issues) ---- */
  .welcome-heading { color: var(--maroon); font-size: 1.5rem; font-weight: 600; margin: 0 0 8px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 34px 0 12px; }
  .section-head:first-child { margin-top: 0; }
  .section-head h2 { font-size: 1.3rem; color: var(--maroon); margin: 0; font-weight: 600; }
  .section-head .count { font-size: 0.8rem; color: var(--ink-soft); }
  .panel { background: var(--paper); border: 1px solid var(--line); overflow: hidden; }

  table.tracker { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
  table.tracker thead th {
    background: var(--maroon-deep); color: #fff; text-align: left; font-weight: 600;
    padding: 10px 12px; font-size: 0.74rem; letter-spacing: 0.01em;
  }
  table.tracker tbody td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  table.tracker tbody tr:nth-child(even) { background: var(--table-grey); }
  table.tracker tbody tr.completed-row { opacity: 0.55; }
  table.tracker input[type=text], table.tracker input[type=date], table.tracker select, table.tracker textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 2px; padding: 6px 8px; font: inherit; font-size: 0.86rem;
    background: #fff; color: var(--ink);
  }
  table.tracker select { font-size: 0.78rem; padding: 6px 4px; }
  .date-display-wrap input.date-native { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--line); border-radius: 2px; background: #fff; font-size: 0.82rem; color: var(--ink); }
  .date-display-wrap .date-display {
    display: block; width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--line); border-radius: 2px;
    background: #fff; font-size: 0.82rem; color: var(--ink); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .date-display-wrap .date-display:hover { border-color: var(--maroon); }
  table.tracker textarea { resize: none; min-height: 34px; overflow: hidden; line-height: 1.4; font-family: inherit; display: block; }

  .status-pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.76rem; font-weight: 600; white-space: nowrap; }
  .status-overdue { background: var(--red-bg); color: var(--red); }
  .status-duesoon { background: var(--amber-bg); color: var(--amber); }
  .status-ontrack { background: #EFEAE0; color: var(--maroon); }
  .status-completed { background: var(--green-bg); color: var(--green); }
  .status-nodate { background: #EEE; color: #888; }

  .icon-btn { background: none; border: none; cursor: pointer; font-size: 1rem; padding: 4px 7px; border-radius: 4px; color: var(--ink-soft); }
  .icon-btn:hover { background: var(--parchment-deep); color: var(--maroon); }

  .add-row-btn {
    display: inline-flex; align-items: center; gap: 6px; background: var(--maroon-deep); color: #fff; border: none;
    padding: 9px 16px; border-radius: 999px; font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-top: 12px;
  }
  .add-row-btn:hover { background: var(--maroon); }

  .empty-state { padding: 30px 16px; text-align: center; color: var(--ink-soft); font-size: 0.88rem; }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .kpi-card { background: var(--maroon-deep); color: #fff; border-radius: 4px; padding: 16px 18px; text-align: center; }
  .kpi-card .label { font-size: 0.68rem; letter-spacing: 0.05em; color: #CBB98A; margin-bottom: 6px; font-family: 'Jost', sans-serif; }
  .kpi-card .value { font-family: 'Jost', sans-serif; font-size: 2rem; font-weight: 600; color: var(--brass-light); }

  table.dash { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  table.dash thead th { background: var(--maroon-deep); color: #fff; padding: 9px 11px; text-align: left; font-size: 0.7rem; }
  table.dash tbody td { padding: 9px 11px; border-top: 1px solid var(--line); }
  table.dash tbody tr:nth-child(even) { background: var(--table-grey); }
  table.dash tbody tr.clickable-row { cursor: pointer; transition: background .12s; }
  table.dash tbody tr.clickable-row:hover { background: rgba(80,108,132,0.14); }
  table.dash .view-hint { color: var(--maroon-light); font-size: 0.72rem; font-weight: 600; margin-left: 6px; opacity: 0; transition: opacity .12s; }
  table.dash tbody tr.clickable-row:hover .view-hint { opacity: 1; }
  table.dash .name-cell { font-weight: 600; color: var(--maroon); }
  table.dash .portfolio-cell { color: var(--ink-soft); font-size: 0.78rem; }
  .overall-ontrack { color: var(--green); font-weight: 600; }
  .overall-monitor { color: var(--amber); font-weight: 600; }
  .overall-atrisk { color: var(--red); font-weight: 600; }

  .issue-card { background: var(--paper); border: 1px solid var(--line); border-left: 3px solid #111; padding: 16px 18px; margin-bottom: 10px; }
  .issue-card .issue-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .issue-card .issue-name { font-weight: 600; color: var(--maroon); font-size: 0.92rem; }
  .issue-card .issue-date { font-size: 0.74rem; color: var(--ink-soft); }
  .issue-card .issue-body { font-size: 0.88rem; line-height: 1.5; color: var(--ink); }
  .issue-card .issue-status { display: inline-block; margin-top: 10px; font-size: 0.72rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; }

  .banner {
    background: var(--brass-light); border: 1px solid var(--brass); color: #5C4718;
    padding: 10px 16px; border-radius: 2px; font-size: 0.82rem; margin-bottom: 18px;
  }
  .banner.error { background: var(--red-bg); border-color: var(--red); color: var(--red); }

  footer.foot { text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 30px 0 10px; }

  /* ---- Post-login loading screen ---- */
  .login-loading {
    position: fixed; inset: 0; z-index: 100;
    background: var(--maroon-deep);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px;
  }
  .login-loading .crest-stack { position: relative; width: 130px; height: 161px; }
  .login-loading .crest-stack img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .login-loading .crest-stack img.outline { opacity: 0.35; }
  .login-loading .crest-stack img.filled {
    clip-path: inset(100% 0 0 0);
    animation: crestFillUp 3s ease-in-out forwards;
  }
  @keyframes crestFillUp {
    0% { clip-path: inset(100% 0 0 0); }
    100% { clip-path: inset(0% 0 0 0); }
  }
  .login-loading .loading-text { color: #E7DFCF; font-family: 'Jost', sans-serif; font-size: 0.95rem; letter-spacing: 0.04em; }

  /* ---- Custom delete-confirmation modal ---- */
  .confirm-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(26,20,16,0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .confirm-box {
    background: var(--paper);
    max-width: 400px; width: 100%;
    border-top: 5px solid var(--red);
    box-shadow: 0 14px 40px rgba(0,0,0,0.3);
    padding: 26px 26px 22px;
  }
  .confirm-box .confirm-icon { font-size: 1.6rem; margin-bottom: 10px; }
  .confirm-box .confirm-message { font-family: 'Jost', sans-serif; font-size: 1.08rem; font-weight: 600; color: var(--ink); margin: 0 0 22px; line-height: 1.4; }
  .confirm-box .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .confirm-box button { font: inherit; font-size: 0.88rem; font-weight: 600; padding: 9px 18px; border-radius: 3px; cursor: pointer; }
  .confirm-box .confirm-cancel { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); }
  .confirm-box .confirm-cancel:hover { background: var(--parchment-deep); }
  .confirm-box .confirm-delete { background: var(--red); border: 1px solid var(--red); color: #fff; }
  .confirm-box .confirm-delete:hover { background: #8C1D14; }

  @media (max-width: 640px) {
    .topbar { flex-wrap: wrap; padding: 10px 14px; }
    .topbar .title { font-size: 0.92rem; }
    .topbar nav { width: 100%; order: 3; margin-left: 0; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.15); }
    .topbar .whoami { display: none; }
    .path-choice { grid-template-columns: 1fr; }
    table.tracker thead { display: none; }
    table.tracker tbody tr { display: block; border-top: 2px solid var(--maroon-deep); }
    table.tracker tbody td { display: block; border-top: none; padding: 6px 12px; }
    table.tracker tbody td:before { content: attr(data-label); display: block; font-size: 0.68rem; color: var(--ink-soft); font-weight: 600; margin-bottom: 2px; }
    table.dash thead { display: none; }
    table.dash tbody tr { display: block; border-top: 2px solid var(--maroon-deep); padding: 10px 0; }
    table.dash tbody td { display: block; padding: 3px 12px; }
    table.dash tbody td:before { content: attr(data-label); display: inline-block; min-width: 90px; font-size: 0.68rem; color: var(--ink-soft); font-weight: 600; }
    table.dash .name-cell { font-size: 1rem; }
    .kpi-row { grid-template-columns: 1fr 1fr; }
    main.app-main { padding: 20px 14px 40px; }
    .form-card { padding: 28px 22px; }
  }
</style>
</head>

function fb() { return window.__fb || { ready: false, db: null }; }

/* =====================================================================
   FIREBASE DATA LAYER
   ===================================================================== */
function watchAll(collectionName, cb) {
  return fb().onSnapshot(fb().collection(fb().db, collectionName), (snap) => {
    const rows = [];
    snap.forEach(d => rows.push({ id: d.id, ...d.data() }));
    cb(rows);
  }, (err) => console.error(collectionName + " snapshot error", err));
}
async function addDocTo(collectionName, data) {
  if (!fb().ready) { alert("This tracker isn't connected to Firebase yet, so nothing can be saved. See the setup guide."); return; }
  return fb().addDoc(fb().collection(fb().db, collectionName), { ...data, createdAt: fb().serverTimestamp() });
}
async function updateDocIn(collectionName, id, data) {
  if (!fb().ready) return;
  return fb().updateDoc(fb().doc(fb().db, collectionName, id), data);
}
async function deleteDocFrom(collectionName, id) {
  if (!fb().ready) return;
  return fb().deleteDoc(fb().doc(fb().db, collectionName, id));
}

/* =====================================================================
   STATUS LOGIC
   ===================================================================== */
function isOverdue(task) {
  if (task.completed || !task.dueDate) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(task.dueDate + "T00:00:00") < today;
}
function daysUntil(task) {
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((new Date(task.dueDate + "T00:00:00") - today) / 86400000);
}
function taskStatus(task) {
  if (task.completed) return { label: "Completed", cls: "status-completed" };
  if (!task.dueDate) return { label: "No due date", cls: "status-nodate" };
  const diffDays = daysUntil(task);
  if (diffDays < 0) return { label: `OVERDUE (${Math.abs(diffDays)}d)`, cls: "status-overdue" };
  if (diffDays <= 7) return { label: `Due in ${diffDays}d`, cls: "status-duesoon" };
  return { label: "On track", cls: "status-ontrack" };
}
function overallStatus(overdueCount) {
  if (overdueCount >= 3) return { label: "At Risk", cls: "overall-atrisk" };
  if (overdueCount >= 1) return { label: "Monitor", cls: "overall-monitor" };
  return { label: "On Track", cls: "overall-ontrack" };
}
function escapeAttr(s) { return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function escapeHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

   ===================================================================== */
function renderTopbar() {
  const topbar = document.getElementById("topbar");
  const nav = document.getElementById("nav");
  const whoami = document.getElementById("whoami");
  if (!currentPerson || ["home","login","report","loading"].includes(currentView)) { topbar.style.display = "none"; return; }
  topbar.style.display = "flex";
  nav.innerHTML = `
    <button data-view="tracker" class="${currentView === "tracker" && !viewingPersonId ? "active" : ""}">My Tracker</button>
    <button data-view="dueToday" class="${currentView === "dueToday" ? "active" : ""}">Due Today</button>
    ${POPS_IDS.has(currentPerson.id) ? `<button data-view="dashboard" class="${currentView === "dashboard" ? "active" : ""}">Dashboard</button>` : ""}
    ${POPS_IDS.has(currentPerson.id) ? `<button data-view="issues" class="${currentView === "issues" ? "active" : ""}">Reported Issues</button>` : ""}
    <button data-view="home">Sign out</button>
  `;
  nav.querySelectorAll("button").forEach(btn => {
    btn.onclick = () => {
      if (btn.dataset.view === "home") { signOut(); return; }
      if (btn.dataset.view === "tracker" || btn.dataset.view === "dueToday") { viewingPersonId = null; }
      currentView = btn.dataset.view;
      renderApp();
    };
  });
  const viewedName = viewingPersonId ? (PEOPLE.find(p => p.id === viewingPersonId)?.name || "") : "";
  whoami.innerHTML = viewingPersonId
    ? `Viewing <b>${viewedName}</b>'s tracker &middot; signed in as ${currentPerson.name}`
    : `Signed in as <b>${currentPerson.name}</b>`;
}

        <h1>Report an Issue</h1>
        <p class="intro">This goes straight to the POPS, no need to be logged in. Use this for anything from "I can't log in" to a bug in the tracker itself.</p>
        ${reportSubmitted ? `
          <div class="form-msg success">Thanks, your report has been sent to the POPS.</div>
          <button class="cta secondary" id="reportAnother">Report another issue</button>
        ` : `
          <form id="reportForm">
            <div class="field">
              <label for="rname">Your name</label>
              <input type="text" id="rname" required>
            </div>
            <div class="field">
              <label for="rcategory">What's this about?</label>
              <select id="rcategory">
                <option>Can't log in</option>
                <option>Something looks wrong / a bug</option>
                <option>A task or check-in isn't saving</option>
                <option>Dashboard looks incorrect</option>
                <option>Other</option>
              </select>
            </div>
            <div class="field">
              <label for="rdesc">Describe the issue</label>
              <textarea id="rdesc" required placeholder="What happened, and what were you trying to do?"></textarea>
            </div>
            <button type="submit" class="cta">Send to POPS</button>
          </form>
        `}
      </div>
    </div>
  `;
  document.getElementById("backHome").onclick = () => { currentView = "home"; renderApp(); };
  if (reportSubmitted) {
    document.getElementById("reportAnother").onclick = () => { reportSubmitted = false; renderApp(); };
    return;
  }
  document.getElementById("reportForm").onsubmit = async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    if (submitBtn.disabled) return;
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending\u2026";
    const name = document.getElementById("rname").value.trim();
    const category = document.getElementById("rcategory").value;
    const description = document.getElementById("rdesc").value.trim();
    await addDocTo("issues", { name, category, description, status: "open" });
    reportSubmitted = true;
    renderApp();
  };
}

function signOut() {
  currentView = "loading";
  loadingMessage = "Signing you out\u2026";
  renderApp();
  if (unsubTasks) unsubTasks();
  if (unsubCheckins) unsubCheckins();
  if (unsubIssues) unsubIssues();
  setTimeout(() => {
    currentPerson = null;
    viewingPersonId = null;
    currentView = "home";
    loadingMessage = "Signing you in\u2026";
    renderApp();
  }, 3000);
}
function rerenderPreservingScroll() {
  const y = window.scrollY;
  renderApp();
  window.scrollTo(0, y);
}

function subscribeForPerson() {
  if (!fb().ready) return;
  if (unsubTasks) unsubTasks();
  if (unsubCheckins) unsubCheckins();
  unsubTasks = watchAll("tasks", (rows) => {
    allTasks = rows;
    if (["tracker","dashboard","dueToday"].includes(currentView)) rerenderPreservingScroll();
  });
  unsubCheckins = watchAll("checkins", (rows) => {
    allCheckins = rows;
    if (["tracker","dashboard","dueToday"].includes(currentView)) rerenderPreservingScroll();
  });
  if (POPS_IDS.has(currentPerson.id)) {
    unsubIssues = watchAll("issues", (rows) => {
      allIssues = rows.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
      if (currentView === "issues") rerenderPreservingScroll();
    });
  }
}

   MY TRACKER
   ===================================================================== */

function showDeleteConfirm(onConfirm) {
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <div class="confirm-icon">&#9888;&#65039;</div>
      <p class="confirm-message">Are you super-duper sure you want to delete this?</p>
      <div class="confirm-actions">
        <button class="confirm-cancel">Cancel</button>
        <button class="confirm-delete">Yes, delete it</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector(".confirm-cancel").onclick = close;
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  overlay.querySelector(".confirm-delete").onclick = () => { close(); onConfirm(); };
}

function formatDateDisplay(dateStr) {
  if (!dateStr) return "No due date";
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const parts = dateStr.split("-").map(Number);
  const dt = new Date(parts[0], parts[1] - 1, parts[2]);
  if (isNaN(dt.getTime())) return "No due date";
  return `${days[dt.getDay()]}, ${dt.getDate()} ${months[dt.getMonth()]}`;
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = (el.scrollHeight) + "px";
}

function renderTaskRow(t, p) {
  const tr = document.createElement("tr");
  if (t.completed) tr.className = "completed-row";
  const st = taskStatus(t);
  tr.innerHTML = `
    <td data-label="Task"><textarea rows="1" data-field="task">${escapeHtml(t.task||"")}</textarea></td>
    <td data-label="Portfolio"><select data-field="portfolio" title="${escapeAttr(t.portfolio||"")}">${p.portfolios.map(pf => `<option value="${escapeAttr(pf)}" ${pf===t.portfolio?"selected":""}>${pf}</option>`).join("")}</select></td>
    <td data-label="Due date">
      <div class="date-display-wrap">
        <input type="date" value="${t.dueDate||""}" data-field="dueDate" class="date-native" style="display:none;">
        <span class="date-display">${formatDateDisplay(t.dueDate)}</span>
      </div>
    </td>
    <td data-label="Done?"><input type="checkbox" ${t.completed?"checked":""} data-field="completed" style="width:18px;height:18px;"></td>
    <td data-label="Status"><span class="status-pill ${st.cls}">${st.label}</span></td>
    <td data-label="Notes"><textarea rows="1" data-field="notes">${escapeHtml(t.notes||"")}</textarea></td>
    <td><button class="icon-btn" title="Delete task" data-delete="tasks:${t.id}">&#10005;</button></td>
  `;
  tr.querySelectorAll("textarea[data-field]").forEach(el => {
    el.addEventListener("input", () => autoResize(el));
  });
  tr.querySelectorAll("[data-field]").forEach(el => {
    el.addEventListener("change", () => {
      const field = el.dataset.field;
      const value = field === "completed" ? el.checked : el.value;
      if (field === "portfolio") el.title = value;
      if (field === "dueDate") {
        const displaySpan = el.parentElement.querySelector(".date-display");
        if (displaySpan) displaySpan.textContent = formatDateDisplay(value);
      }
      updateDocIn("tasks", t.id, { [field]: value });
    });
  });
  const dateSpan = tr.querySelector(".date-display");
  const dateInput = tr.querySelector("input.date-native");
  if (dateSpan && dateInput) {
    dateSpan.addEventListener("click", () => {
      dateSpan.style.display = "none";
      dateInput.style.display = "block";
      dateInput.focus();
      if (dateInput.showPicker) { try { dateInput.showPicker(); } catch (e) {} }
    });
    dateInput.addEventListener("blur", () => {
      dateInput.style.display = "none";
      dateSpan.style.display = "block";
    });
  }
  return tr;
}
function renderCheckinRow(c) {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td data-label="Date"><input type="date" value="${c.date||""}" data-field="date"></td>
    <td data-label="Score"><select data-field="score">${[1,2,3,4,5].map(n => `<option value="${n}" ${n==c.score?"selected":""}>${n}</option>`).join("")}</select></td>
    <td data-label="Comments"><textarea rows="1" data-field="comments">${escapeHtml(c.comments||"")}</textarea></td>
    <td><button class="icon-btn" title="Delete" data-delete="checkins:${c.id}">&#10005;</button></td>
  `;
  tr.querySelectorAll("textarea[data-field]").forEach(el => {
    el.addEventListener("input", () => autoResize(el));
  });
  tr.querySelectorAll("[data-field]").forEach(el => {
    el.addEventListener("change", () => {
      const field = el.dataset.field;
      const value = field === "score" ? Number(el.value) : el.value;
      updateDocIn("checkins", c.id, { [field]: value });
    });
  });
  return tr;
}

/* =====================================================================
   DASHBOARD (POPS only)
   ===================================================================== */
function buildCheckinChartSVG(perPerson) {
  // Sort so the lowest (most concerning) scores surface first; no-data entries sink to the bottom.
  const sorted = [...perPerson].sort((a, b) => {
    if (a.avgCheckin === null && b.avgCheckin === null) return 0;
    if (a.avgCheckin === null) return 1;
    if (b.avgCheckin === null) return -1;
    return a.avgCheckin - b.avgCheckin;
  });
  const barColorFor = (score) => score === null ? "#C9C2B4" : (score >= 4 ? "#2E6B3E" : score >= 3 ? "#506C84" : score >= 2 ? "#A56A0E" : "#A32E22");

  const isMobile = window.innerWidth < 640;
  if (isMobile) {
    const rowH = 38;
    const chartW = 340;
    const topPad = 6;
    const h = sorted.length * rowH + topPad;
    const bars = sorted.map((r, i) => {
      const y = topPad + i * rowH;
      const score = r.avgCheckin;
      const barW = score ? Math.max(4, (score / 5) * chartW) : 0;
      const valueLabel = score === null ? "No data" : score.toFixed(1);
      return `
        <text x="0" y="${y + 10}" font-size="10.5" fill="#211D1A" font-family="Inter, sans-serif" font-weight="600">${escapeHtml(r.p.name)}</text>
        <text x="${chartW}" y="${y + 10}" text-anchor="end" font-size="9.5" fill="#5B6B75" font-family="Inter, sans-serif">${valueLabel}</text>
        <rect x="0" y="${y + 15}" width="${chartW}" height="12" fill="#EDEAE3" rx="3"></rect>
        <rect x="0" y="${y + 15}" width="${barW}" height="12" fill="${barColorFor(score)}" rx="3"></rect>
      `;
    }).join("");
    return `<svg viewBox="0 0 ${chartW} ${h}" style="width:100%; height:auto; display:block;">${bars}</svg>`;
  }

  const rowH = 22;
  const chartW = 640;
  const labelW = 158;
  const barAreaW = chartW - labelW - 44;
  const topPad = 8;
  const scaleH = 16;
  const h = sorted.length * rowH + topPad * 2 + scaleH;

  // Faint vertical gridlines at 1,2,3,4,5 so bars can be read against a scale, plus axis labels along the top.
  const gridlines = [1,2,3,4,5].map(n => {
    const x = labelW + (n / 5) * barAreaW;
    return `
      <line x1="${x}" y1="${topPad + scaleH}" x2="${x}" y2="${h}" stroke="#E3DBC9" stroke-width="1"></line>
      <text x="${x}" y="${topPad + 10}" text-anchor="middle" font-size="8.5" fill="#8A8578" font-family="Inter, sans-serif">${n}</text>
    `;
  }).join("");

  const bars = sorted.map((r, i) => {
    const y = topPad + scaleH + i * rowH;
    const score = r.avgCheckin;
    const barW = score ? Math.max(4, (score / 5) * barAreaW) : 0;
    const valueLabel = score === null ? "No data" : score.toFixed(1);
    return `
      <text x="${labelW - 10}" y="${y + rowH/2 + 3}" text-anchor="end" font-size="9.5" fill="#211D1A" font-family="Inter, sans-serif">${escapeHtml(r.p.name)}</text>
      <rect x="${labelW}" y="${y + 4}" width="${barAreaW}" height="${rowH - 9}" fill="#EDEAE3" rx="2"></rect>
      <rect x="${labelW}" y="${y + 4}" width="${barW}" height="${rowH - 9}" fill="${barColorFor(score)}" rx="2"></rect>
      <text x="${labelW + barAreaW + 8}" y="${y + rowH/2 + 3}" font-size="9" fill="#5B6B75" font-family="Inter, sans-serif">${valueLabel}</text>
    `;
  }).join("");
  return `<svg viewBox="0 0 ${chartW} ${h}" style="width:100%; height:auto; display:block;">${gridlines}${bars}</svg>`;
}

function todayDateStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

  const app = document.getElementById("app");
  const p = currentPerson;
  const todayStr = todayDateStr();

  app.innerHTML = `

function renderDashboard() {
  const app = document.getElementById("app");
  const canDrillIn = POPS_IDS.has(currentPerson.id);
  const totalHKs = PEOPLE.filter(p => p.id !== "luke-cuff").length;
  let totalOverdue = 0, totalTasks = 0, totalCompleted = 0;
  const perPerson = PEOPLE.filter(p => p.id !== "luke-cuff").map(p => {
    const tasks = allTasks.filter(t => t.personId === p.id);
    const checkins = allCheckins.filter(c => c.personId === p.id);
    const avgCheckin = checkins.length ? (checkins.reduce((s,c) => s + (Number(c.score) || 0), 0) / checkins.length) : null;
    const overdue = tasks.filter(t => isOverdue(t)).length;
    const completed = tasks.filter(t => t.completed).length;
    totalOverdue += overdue; totalTasks += tasks.length; totalCompleted += completed;
    return { p, tasks, checkins, avgCheckin, overdue, completed, status: overallStatus(overdue) };
  });
  const importCount = Object.values(EXCEL_IMPORT_TASKS).reduce((sum, arr) => sum + arr.length, 0);
  const showImport = totalTasks === 0 && importCount > 0;
  app.innerHTML = `
    <main class="app-main">
    <div class="section-head"><h2>HK Portfolio Dashboard</h2><span class="count">Live: updates as everyone edits</span></div>
    ${showImport ? `
      <div class="banner">
        This tracker is empty so far. There are <b>${importCount} tasks</b> carried over from the old Excel tracker, ready to bring in.
        <button class="icon-btn" id="importExcelBtn" style="margin-left:10px; background:var(--maroon); color:#fff; padding:6px 14px; border-radius:999px;">Import Excel tasks now</button>
      </div>
    ` : ""}
    <div class="kpi-row">
      <div class="kpi-card"><div class="label">TOTAL HKs</div><div class="value">${totalHKs}</div></div>
      <div class="kpi-card"><div class="label">OVERDUE TASKS</div><div class="value">${totalOverdue}</div></div>
      <div class="kpi-card"><div class="label">COMPLETION</div><div class="value">${totalTasks ? Math.round(100*totalCompleted/totalTasks) : 0}%</div></div>
    </div>
    <div class="panel">
      <table class="dash">
        <thead><tr><th>HK Name</th><th>Portfolio(s)</th><th>Total</th><th>Completed</th><th>Overdue</th><th>Overall status</th></tr></thead>
        <tbody>
          ${perPerson.map(r => `
            <tr ${canDrillIn ? `class="clickable-row" data-person="${r.p.id}"` : ""}>
              <td class="name-cell" data-label="HK Name">${r.p.name}${canDrillIn ? ` <span class="view-hint">View &#8250;</span>` : ""}</td>
              <td class="portfolio-cell" data-label="Portfolio(s)">${r.p.portfolios.join(", ")}</td>
              <td data-label="Total">${r.tasks.length}</td>
              <td data-label="Completed">${r.completed}</td>
              <td data-label="Overdue">${r.overdue}</td>
              <td class="${r.status.cls}" data-label="Status">${r.status.label}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>

    <div class="section-head"><h2>Average Check-in Score by HK</h2><span class="count">1-5 scale</span></div>
    <div class="panel" style="padding:16px 18px;">
      ${buildCheckinChartSVG(perPerson)}
    </div>
    </main>
    <footer class="foot">Helshoogte HK Portfolio Tracker</footer>
  `;
  if (canDrillIn) {
    document.querySelectorAll("tr[data-person]").forEach(tr => {
      tr.onclick = () => {
        viewingPersonId = tr.dataset.person === currentPerson.id ? null : tr.dataset.person;
        currentView = "tracker";
        renderApp();
      };
    });
  }
  if (showImport) {
    document.getElementById("importExcelBtn").onclick = async () => {
      if (!confirm(`This will add ${importCount} tasks (carried over from the old Excel tracker) across ${Object.keys(EXCEL_IMPORT_TASKS).length} people. Run this once only, running it twice will create duplicates. Continue?`)) return;
      const btn = document.getElementById("importExcelBtn");
      btn.textContent = "Importing...";
      btn.disabled = true;
      let count = 0;
      for (const [personId, tasks] of Object.entries(EXCEL_IMPORT_TASKS)) {
        for (const t of tasks) {
          await addDocTo("tasks", { personId, ...t });
          count++;
        }
      }
      alert(`Done, ${count} tasks imported.`);
      renderApp();
    };
  }
}

/* =====================================================================
   REPORTED ISSUES (POPS only)
   ===================================================================== */
function renderIssues() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <main class="app-main">
    <div class="section-head"><h2>Reported Issues</h2><span class="count">${allIssues.length} report${allIssues.length===1?"":"s"}</span></div>
    <div id="issueList"></div>
    </main>
    <footer class="foot">Helshoogte HK Portfolio Tracker</footer>
  `;
  const list = document.getElementById("issueList");
  if (allIssues.length === 0) {
    list.innerHTML = `<div class="empty-state panel">No issues reported. All quiet.</div>`;
    return;
  }
  allIssues.forEach(issue => {
    const div = document.createElement("div");
    div.className = "issue-card";
    const when = issue.createdAt?.seconds ? new Date(issue.createdAt.seconds * 1000).toLocaleString() : "";
    const isOpen = issue.status !== "resolved";
    div.innerHTML = `
      <div class="issue-head">
        <span class="issue-name">${escapeHtml(issue.name || "Unknown")} &middot; ${escapeHtml(issue.category || "Other")}</span>
        <span class="issue-date">${when}</span>
      </div>
      <div class="issue-body">${escapeHtml(issue.description || "")}</div>
      <span class="issue-status" style="background:${isOpen ? "var(--amber-bg)" : "var(--green-bg)"}; color:${isOpen ? "var(--amber)" : "var(--green)"};">${isOpen ? "Open" : "Resolved"}</span>
      <button class="icon-btn" style="margin-left:8px;" data-toggle="${issue.id}">${isOpen ? "Mark resolved" : "Reopen"}</button>
    `;
    div.querySelector("[data-toggle]").onclick = () => updateDocIn("issues", issue.id, { status: isOpen ? "resolved" : "open" });
    list.appendChild(div);
  });
}

/* =====================================================================
   MAIN RENDER DISPATCH
   ===================================================================== */
function renderApp() {
  renderTopbar();
  if (currentView === "home") return renderHome();
  if (currentView === "login") return renderLogin();
  if (currentView === "report") return renderReport();
  if (currentView === "loading") return renderLoadingScreen();
  if (!currentPerson) { currentView = "home"; return renderHome(); }
  if (currentView === "dashboard") return renderDashboard();
  if (currentView === "issues") return renderIssues();
  if (currentView === "dueToday") return renderDueToday();
  return renderTracker();
}

document.getElementById("app").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-delete]");
  if (!btn) return;
  const [collection, id] = btn.dataset.delete.split(":");
  showDeleteConfirm(() => deleteDocFrom(collection, id));
});

window.addEventListener("firebase-ready", () => { renderApp(); });
let resizeDebounce = null;
window.addEventListener("resize", () => {
  document.querySelectorAll("table.tracker textarea[data-field]").forEach(el => autoResize(el));
  if (currentView === "dashboard") {
    clearTimeout(resizeDebounce);
    resizeDebounce = setTimeout(() => renderApp(), 200);
  }
});
renderApp();
